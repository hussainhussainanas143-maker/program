<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>59. News/Blog Layout Using CSS Grid</title>
<style>
body{margin:0;font-family:Georgia,serif}
.blog{display:grid;grid-template-columns:2fr 1fr;gap:20px;padding:20px}
.featured{grid-row:span 2}
.blog article{background:#fff;border:1px solid #eee;border-radius:8px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.blog img{width:100%;height:160px;object-fit:cover}
.blog .info{padding:12px}
</style></head>
<body>
<div class="blog">
  <article class="featured"><img src="https://picsum.photos/id/1025/600/300"><div class="info"><h2>Top Story of the Day</h2><p>Lead article summary goes here.</p></div></article>
  <article><img src="https://picsum.photos/id/1035/400/200"><div class="info"><h3>Side Story One</h3></div></article>
  <article><img src="https://picsum.photos/id/1036/400/200"><div class="info"><h3>Side Story Two</h3></div></article>
</div>
</body></html>
