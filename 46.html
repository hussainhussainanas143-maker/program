<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>46. Card-based Layout Using Flexbox</title>
<style>
.cards{display:flex;flex-wrap:wrap;gap:16px;padding:20px;font-family:Arial}
.card{flex:1 1 220px;max-width:260px;background:#fff;border:1px solid #ddd;border-radius:8px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
</style></head>
<body style="background:#f7f7f7">
<div class="cards">
  <div class="card"><h3>Card One</h3><p>Flexbox makes these cards wrap and grow evenly.</p></div>
  <div class="card"><h3>Card Two</h3><p>Resize the window to see responsiveness.</p></div>
  <div class="card"><h3>Card Three</h3><p>Each card has flex-basis 220px.</p></div>
</div>
</body></html>
