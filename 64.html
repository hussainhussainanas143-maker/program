<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>64. Mobile-First Responsive Webpage</title>
<style>
/* mobile-first base styles */
.container{display:flex;flex-direction:column;gap:12px;padding:16px}
.card{background:#f1faee;padding:16px;border-radius:6px}
/* scale up for tablets */
@media (min-width:600px){ .container{flex-direction:row;flex-wrap:wrap} .card{flex:1 1 45%} }
/* scale up for desktop */
@media (min-width:1000px){ .card{flex:1 1 22%} }
</style></head>
<body>
<div class="container">
  <div class="card">Card 1</div><div class="card">Card 2</div>
  <div class="card">Card 3</div><div class="card">Card 4</div>
</div>
</body></html>
