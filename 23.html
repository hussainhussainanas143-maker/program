<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>23. Product Card</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f2f2;display:flex;justify-content:center;padding:40px}
.card{width:260px;background:#fff;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.15);overflow:hidden}
.card img{width:100%;height:180px;object-fit:cover}
.card-body{padding:16px}
.card-body h3{margin:0 0 8px}
.price{color:#e63946;font-weight:bold;font-size:1.2em}
.btn{display:block;width:100%;margin-top:12px;padding:10px;border:none;background:#1d3557;color:#fff;border-radius:6px;cursor:pointer}
.btn:hover{background:#457b9d}
</style></head>
<body>
<div class="card">
  <img src="https://picsum.photos/300/200" alt="Product">
  <div class="card-body">
    <h3>Wireless Headphones</h3>
    <p>Noise-cancelling, 30hr battery life.</p>
    <span class="price">$59.99</span>
    <button class="btn">Add to Cart</button>
  </div>
</div>
</body></html>
