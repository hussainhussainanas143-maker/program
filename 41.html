<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>41. Tooltip</title>
<style>
.tooltip{position:relative;display:inline-block;border-bottom:1px dotted #333;font-family:Arial;cursor:pointer}
.tooltip .tooltiptext{visibility:hidden;opacity:0;width:140px;background:#333;color:#fff;text-align:center;border-radius:6px;padding:6px;position:absolute;z-index:1;bottom:125%;left:50%;transform:translateX(-50%);transition:opacity .3s}
.tooltip:hover .tooltiptext{visibility:visible;opacity:1}
</style></head>
<body style="padding:80px;text-align:center">
<div class="tooltip">Hover over me
  <span class="tooltiptext">I'm a CSS-only tooltip!</span>
</div>
</body></html>
