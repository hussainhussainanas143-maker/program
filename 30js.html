<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>30. Form Validation Program</title>
<style>body{font-family:Arial;padding:40px}.error{color:red;font-size:.9em}</style>
</head>
<body>
<form id="form" onsubmit="return validateForm()">
  <label>Username: <input id="username" type="text"></label><br><br>
  <button type="submit">Submit</button>
  <p id="error" class="error"></p>
</form>
<script>
function validateForm() {
  const username = document.getElementById("username").value.trim();
  const errorEl = document.getElementById("error");
  if (username.length < 3) {
    errorEl.textContent = "Username must be at least 3 characters.";
    return false;
  }
  errorEl.textContent = "";
  alert("Form submitted successfully!");
  return false;
}
</script>
</body></html>
