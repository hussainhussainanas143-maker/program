<!DOCTYPE html>
<html>
<head>
    <title>Pseudo Classes</title>

    <style>
        a {
            color: blue;
        }

        a:hover {
            color: red;
        }

        a:active {
            color: green;
        }

        a:visited {
            color: purple;
        }

        input:focus {
            background-color: lightyellow;
            border: 3px solid blue;
        }
    </style>
</head>
<body>

    <h1>Pseudo Classes</h1>

    <a href="https://www.google.com">
        Visit Google
    </a>

    <br><br>

    <input type="text" placeholder="Click here">

</body>
</html>
