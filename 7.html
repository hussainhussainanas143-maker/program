<!DOCTYPE html>
<html>
<head>
    <title>CSS Positioning</title>

    <style>
        .static {
            position: static; 
            background: lightgray;
            padding: 20px;
        }

        .relative {
            position: relative;
            left: 50px;
            background: lightblue;
            padding: 20px;
        }

        .parent {
            position: relative;
            height: 200px;
            background: lightgreen;
        }

        .absolute {
            position: absolute;
            right: 20px;
            top: 50px;
            background: orange;
            padding: 20px;
        }

        .fixed {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: red;
            color: white;
            padding: 15px;
        }

        .sticky {
            position: sticky;
            top: 0;
            background: purple;
            color: white;
            padding: 15px;
        }
    </style>
</head>
<body>

    <div class="static">Static Position</div>

    <div class="relative">Relative Position</div>

    <div class="sticky">Sticky Position</div>

    <div class="parent">
        Parent
        <div class="absolute">Absolute Position</div>
    </div>

    <div class="fixed">Fixed Position</div>

    <p style="height:500px;">
        Scroll the page to see sticky and fixed positioning.
    </p>

</body>
</html>
