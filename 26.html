<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>26. Inheritance & Specificity</title>
<style>
body{font-family:Georgia,serif;color:#333}       /* inherited by children */
#special{color:red}                              /* ID: specificity 100 */
.highlight{color:blue}                            /* class: specificity 10 */
p{color:green}                                    /* element: specificity 1 */
p.highlight#special{color:purple}                 /* highest specificity wins */
</style></head>
<body>
<p>This paragraph inherits font-family from body and is colored by the element selector (green).</p>
<p class="highlight">This one is blue via the class selector (beats element).</p>
<p id="special" class="highlight">This one is purple: ID+class+element combined beats a lone ID or class.</p>
</body></html>
