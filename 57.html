<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>57. Online Shopping Webpage</title>
<style>
body{margin:0;font-family:Arial;background:#fafafa}
header{background:#ff6f61;color:#fff;padding:16px 30px;display:flex;justify-content:space-between;align-items:center}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;padding:24px}
.product{background:#fff;border-radius:8px;padding:12px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.product img{width:100%;height:120px;object-fit:cover;border-radius:6px}
.product button{margin-top:8px;padding:8px 14px;background:#264653;color:#fff;border:none;border-radius:5px;cursor:pointer}
</style></head>
<body>
<header><h2>ShopEase</h2><span>🛒 Cart (0)</span></header>
<div class="products">
  <div class="product"><img src="https://picsum.photos/id/201/200/150"><p>Sneakers - $45</p><button>Buy</button></div>
  <div class="product"><img src="https://picsum.photos/id/202/200/150"><p>Backpack - $30</p><button>Buy</button></div>
  <div class="product"><img src="https://picsum.photos/id/203/200/150"><p>Watch - $60</p><button>Buy</button></div>
</div>
</body></html>
