<!DOCTYPE html>
<html>
<head>
    <title>CSS Animation</title>

    <style>
        .box {
            width: 100px;
            height: 100px;
            background-color: red;
            position: relative;

            animation-name: move;
            animation-duration: 4s;
            animation-iteration-count: infinite;
        }

        @keyframes move {

            0% {
                left: 0;
                background-color: red;
            }

            50% {
                left: 400px;
                background-color: blue;
            }

            100% {
                left: 0;
                background-color: green;
            }
        }
    </style>
</head>
<body>

    <h1>CSS Animation</h1>

    <div class="box"></div>

</body>
</html>
