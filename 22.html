<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: lightblue;
        }

        .login {
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 15px gray;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        input[type="submit"] {
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: darkblue;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="login">

        <h1>Login</h1>

        <form>

            <label>Email</label>
            <input
                type="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>
            <input
                type="password"
                placeholder="Enter your password"
                required
            >

            <input type="submit" value="Login">

            <a href="#">Forgot Password?</a>

        </form>

    </div>

</body>
</html>
