<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>42. Button Hover Animation</title>
<style>
.btn{padding:14px 28px;font-size:16px;border:none;border-radius:6px;background:#e63946;color:#fff;cursor:pointer;transition:all .3s ease;box-shadow:0 4px 0 #b02a37}
.btn:hover{background:#ff4d5e;transform:translateY(-3px);box-shadow:0 7px 0 #b02a37}
.btn:active{transform:translateY(1px);box-shadow:0 2px 0 #b02a37}
</style></head>
<body style="text-align:center;padding:100px">
<button class="btn">Hover / Click Me</button>
</body></html>
