<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>74. CSS calc() Function</title>
<style>
.wrapper{display:flex;padding:10px}
.sidebar{width:200px;background:#264653;color:#fff;padding:10px}
.main{width:calc(100% - 220px);margin-left:20px;background:#f1faee;padding:10px}
.box{width:calc(50% - 10px);height:80px;background:#457b9d;display:inline-block;margin:5px}
</style></head>
<body>
<div class="wrapper">
  <div class="sidebar">Sidebar 200px</div>
  <div class="main">Main = calc(100% - 220px)</div>
</div>
<div class="box"></div><div class="box"></div>
</body></html>
