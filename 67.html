<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>67. Keyframe Animations</title>
<style>
@keyframes bounce{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-40px)}
}
.ball{width:60px;height:60px;background:#e63946;border-radius:50%;margin:60px auto;animation:bounce 1s infinite ease-in-out}
</style></head>
<body>
<div class="ball"></div>
</body></html>
