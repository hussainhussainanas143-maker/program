<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>34. Opacity & Transparency</title>
<style>
body{background:url('https://picsum.photos/800/300') center/cover;padding:60px;font-family:Arial}
.box{width:200px;padding:20px;margin-bottom:10px;color:#fff}
.op-100{background:rgba(0,0,0,1)}
.op-70{opacity:.7;background:#000}
.op-40{opacity:.4;background:#000}
.rgba-box{background:rgba(0,0,0,.5)}
</style></head>
<body>
<div class="box op-100">Fully opaque</div>
<div class="box op-70">70% opacity</div>
<div class="box op-40">40% opacity</div>
<div class="box rgba-box">RGBA transparency (only background transparent)</div>
</body></html>
