<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>56. Restaurant Webpage</title>
<style>
body{margin:0;font-family:Georgia,serif;background:#fffaf0}
header{background:#6b2737;color:#fff;text-align:center;padding:50px 20px}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;padding:30px}

<body>
<header><h1>La Belle Table</h1><p>Fine Dining Experience</p></header>
<div class="menu">
  <div class="dish"><img src="https://picsum.photos/id/292/300/200"><div class="info"><h3>Truffle Pasta</h3><p>$18</p></div></div>
  <div class="dish"><img src="https://picsum.photos/id/312/300/200"><div class="info"><h3>Grilled Salmon</h3><p>$24</p></div></div>
  <div class="dish"><img src="https://picsum.photos/id/365/300/200"><div class="info"><h3>Berry Tart</h3><p>$9</p></div></div>
</div>
</body></html>
