<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>49. Three-Column Layout Using Flexbox</title>
<style>
body{margin:0;font-family:Arial}
.layout{display:flex;min-height:100vh}
.left,.right{flex:1;background:#a8dadc;padding:20px}
.center{flex:2;background:#f1faee;padding:20px}
</style></head>
<body>
<div class="layout">
  <div class="left">Left Column</div>
  <div class="center">Center Column (main content)</div>
  <div class="right">Right Column</div>
</div>
</body></html>
