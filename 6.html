<!DOCTYPE html>
<html>
<head>
    <title>Width and Height</title>

    <style>
        .box1 {
            width: 300px;
            height: 100px;
            background-color: lightblue;
        }

        .box2 {
            width: 50%;
            height: 150px;
            background-color: lightgreen;
        }

        .box3 {
            min-width: 200px;
            max-width: 500px;
            height: 100px;
            background-color: lightcoral;
        }
    </style>
</head>
<body>

    <div class="box1">300px Width</div>
    <br>

    <div class="box2">50% Width</div>
    <br>

    <div class="box3">Min and Max Width</div>

</body>
</html>
