<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>71. Dark Mode Using CSS Variables</title>
<style>
:root{ --bg:#ffffff; --text:#111111; --card:#f4f4f4; }
[data-theme="dark"]{ --bg:#121212; --text:#f0f0f0; --card:#1e1e1e; }
body{background:var(--bg);color:var(--text);font-family:Arial;transition:.3s;padding:40px;text-align:center}
.card{background:var(--card);padding:20px;border-radius:8px;max-width:300px;margin:20px auto}
button{padding:10px 18px;border:none;border-radius:5px;background:#457b9d;color:#fff;cursor:pointer}
</style></head>
<body>
<button onclick="document.body.toggleAttribute('data-theme'); document.body.dataset.theme = document.body.hasAttribute('data-theme') ? 'dark' : ''">Toggle Dark Mode</button>
<div class="card"><h3>Themed Card</h3><p>Uses CSS variables to switch themes.</p></div>
</body></html>
