<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>38. Visibility & Hiding</title>
<style>
.row{margin:10px;font-family:Arial}
.hidden-vis{visibility:hidden}   /* keeps its space, invisible */
.hidden-disp{display:none}       /* removed from layout entirely */
</style></head>
<body>
<div class="row">Before</div>
<div class="row hidden-vis">This takes up space but is invisible</div>
<div class="row hidden-disp">This is completely removed from layout</div>
<div class="row">After</div>
</body></html>
