<!DOCTYPE html>
<html>
<head>
    <title>CSS Flexbox</title>

    <style>
        .container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 20px;
            height: 300px;
            background-color: lightgray;
        }

        .box {
            width: 150px;
            padding: 40px;
            background-color: lightblue;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>CSS Flexbox</h1>

    <div class="container">

        <div class="box">HTML</div>
        <div class="box">CSS</div>
        <div class="box">JavaScript</div>

    </div>

</body>
</html>
