<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>33. Border Radius Shapes</title>
<style>
body{display:flex;gap:30px;justify-content:center;padding:60px;background:#f5f5f5}
.shape{width:100px;height:100px;background:#457b9d}
.circle{border-radius:50%}
.rounded{border-radius:20px}
.oval{width:160px;height:100px;border-radius:50%}
.pill{width:160px;height:60px;border-radius:30px}
</style></head>
<body>
<div class="shape circle"></div>
<div class="shape rounded"></div>
<div class="shape oval"></div>
<div class="shape pill"></div>
</body></html>
