<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>
        .box {
            width: 300px;
            background-color: rgb(94, 168, 142);

            /* Content */
            text-align: center;
            height: 100px;
            

            /* Padding */
            padding: 50px;

            /* Border */
            border: 58px solid blue;

            /* Margin */
            margin: 50px;
        }
    </style>
</head>
<body>

    <p class="box">
       <strong><i>CSS Box Model</i></strong> <br>
       <bold>This box demonstrates the CSS box model.</bold>
    </p>

</body>
</html>
