<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>37. Display Properties</title>
<style>
.block{display:block;background:#ffe;border:1px solid #999}
.inline{display:inline;background:#efe;border:1px solid #999}
.inline-block{display:inline-block;width:100px;background:#eef;border:1px solid #999}
.none{display:none}
</style></head>
<body>
<span class="block">Block element</span>
<span class="block">Another block (own line)</span>
<span class="inline">Inline A</span><span class="inline">Inline B (same line)</span>
<span class="inline-block">Inline-block 1</span><span class="inline-block">Inline-block 2</span>
<span class="none">You will never see this (display:none)</span>
</body></html>
