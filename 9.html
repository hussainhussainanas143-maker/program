<!DOCTYPE html>
<html>
<head>
    <title>Navigation Bar</title>

    <style>
        nav {
            background-color: black;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 15px;
            margin: 10px;
        }

        nav a:hover {
            background-color: blue;
        }
    </style>
</head>
<body>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

</body>
</html>
