<!DOCTYPE html>
<html>
<head>

    <title>Internal and External CSS</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        h1 {
            text-align: right;
            color: blue;
        }

        p {
            font-size: 23px;
        }
    </style>

</head>
<body>

    <h1>CSS Styling</h1>

    <p>This paragraph uses internal CSS.</p>

    <div class="box">
        This box uses external CSS.
    </div>

</body>
</html>
