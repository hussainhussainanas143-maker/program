<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>36. Z-Index & Stacking Order</title>
<style>
.wrap{position:relative;height:220px}
.box{position:absolute;width:150px;height:150px;border-radius:8px;color:#fff;font-family:Arial;display:flex;align-items:center;justify-content:center}
.box1{background:#e63946;top:20px;left:20px;z-index:1}
.box2{background:#457b9d;top:60px;left:80px;z-index:3}
.box3{background:#2a9d8f;top:100px;left:140px;z-index:2}
</style></head>
<body>
<div class="wrap">
  <div class="box box1">z-index:1</div>
  <div class="box box2">z-index:3</div>
  <div class="box box3">z-index:2</div>
</div>
</body></html>
