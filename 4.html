<!DOCTYPE html>
<html>
<head>
    <title>Fonts and Text</title>

    <style>
        h1 {
            font-family: Arial;
            font-size: 40px;
            font-weight: bold;
            font-style: italic;
            text-align: center;
        }

        p {
            font-family: Georgia;
            font-size: 20px;
            line-height: 1.8;
            text-align:justify;
            text-transform: uppercase;
            text-decoration: underline;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <h1>CSS Font Properties</h1>

    <p>
        This text demonstrates font and text formatting.
    </p>

</body>
</html>
