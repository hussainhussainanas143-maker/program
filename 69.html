<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>69. Sliding Image/Card Animation</title>
<style>
@keyframes slideIn{ from{transform:translateX(-120%); opacity:0} to{transform:translateX(0); opacity:1} }
.card{width:220px;padding:20px;background:#a8dadc;border-radius:8px;margin:60px auto;animation:slideIn 1s ease-out forwards;font-family:Arial;text-align:center}
</style></head>
<body>
<div class="card">I slide in from the left!</div>
</body></html>
