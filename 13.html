<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightgray;
        }

        .form {
            width: 400px;
            margin: 50px auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        input[type="submit"] {
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: darkgreen;
        }
    </style>
</head>
<body>

    <div class="form">

        <h2>Registration Form</h2>

        <form>
            <label>Name</label>
            <input type="text">

            <label>Email</label>
            <input type="email">

            <label>Password</label>
            <input type="password">

            <label>Course</label>
            <select>
                <option>B.Tech</option>
                <option>BCA</option>
                <option>MCA</option>
            </select>

            <label>Address</label>
            <textarea rows="4"></textarea>

            <input type="submit" value="Register">
        </form>

    </div>

</body>
</html>
