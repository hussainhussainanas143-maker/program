<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>63. Responsive Grid + Media Queries</title>
<style>
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:20px}
.grid div{background:#457b9d;color:#fff;padding:20px;text-align:center;border-radius:6px}
@media (max-width:900px){ .grid{grid-template-columns:repeat(2,1fr)} }
@media (max-width:500px){ .grid{grid-template-columns:1fr} }
</style></head>
<body>
<div class="grid">
  <div>1</div><div>2</div><div>3</div><div>4</div>
  <div>5</div><div>6</div><div>7</div><div>8</div>
</div>
</body></html>
