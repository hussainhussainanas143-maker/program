<!DOCTYPE html>
<html>
<head>
    <title>Transitions and Transformations</title>

    <style>
        .box {
            width: 150px;
            height: 150px;
            background-color: lightblue;
            margin: 100px;
            transition: 1s;
        }

        .box:hover {
            transform: rotate(45deg) scale(1.3);
            background-color: orange;
        }
    </style>
</head>
<body>

    <h1>Hover Over the Box</h1>

    <div class="box"></div>

</body>
</html>
