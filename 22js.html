<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>22. Change Text Using JavaScript</title></head>
<body>
<p id="text">Original text</p>
<button onclick="changeText()">Change Text</button>
<script>
function changeText() {
  document.getElementById("text").textContent = "Text changed using JavaScript!";
}
</script>
</body></html>
