
<!DOCTYPE html>

<html>
<head>
 <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Webpage</title>

    <style>

        body {
            font-family: Arial;
            margin: 0;
        }

        .header {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .container {
            display: flex;
            gap: 20px;
            padding: 30px;
        }

        .box {
            /* flex: 1px; */
            background-color: lightblue;
            padding: 30px;
            text-align: center;
        }

        /* Mobile Screen */
        @media (max-width: 600px) {

            .container {
                flex-direction: column;
            }

            .header {
                font-size: 18px;
            }

            .box {
                font-size: 16px;
            }
        }

    </style>

</head>
<body>

    <div class="header">
        <h1>Responsive Website</h1>
    </div>

    <div class="container">

        <div class="box">
            <h2>HTML</h2>
            <p>Structure of webpage</p>
        </div>

        <div class="box">
            <h2>CSS</h2>
            <p>Style of webpage</p>
        </div>

        <div class="box">
            <h2>JavaScript</h2>
            <p>Functionality of webpage</p>
        </div>

    </div>

</body>
</html>
