<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>24. Responsive Photo Gallery</title>
<style>
body{margin:0;font-family:Arial}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;padding:20px}
.gallery img{width:100%;height:180px;object-fit:cover;border-radius:8px;transition:.3s}
.gallery img:hover{transform:scale(1.03)}
</style></head>
<body>
<h2 style="text-align:center">Responsive Photo Gallery</h2>
<div class="gallery">
  <img src="https://picsum.photos/id/10/400/300" alt="">
  <img src="https://picsum.photos/id/20/400/300" alt="">
  <img src="https://picsum.photos/id/30/400/300" alt="">
  <img src="https://picsum.photos/id/40/400/300" alt="">
  <img src="https://picsum.photos/id/50/400/300" alt="">
  <img src="https://picsum.photos/id/60/400/300" alt="">
</div>
</body></html>
