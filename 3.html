<!DOCTYPE html>
<html>
<head>
    <title>Colors and Borders</title>
    

    <style>
        body {
            background-color: lightgray;
        }

        h1 {
            color: blue;
            background-color: white;
            border: 3px dashed black;
            padding: 15px;
        }

        p {
            color: white;
            background-color: green;
            border: 2px dashed yellow;
            padding: 20px;
        }
    </style>
</head>
<body>

    <h1>CSS Colors and Borders</h1>

    <p>
        This paragraph demonstrates colors,
        backgrounds and borders.
    </p>

</body>
</html>
