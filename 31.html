<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>31. Linear & Radial Gradients</title>
<style>
.box{width:280px;height:150px;margin:20px auto;border-radius:10px;}
.linear{background:linear-gradient(135deg,#ff9a9e,#fad0c4);}
.radial{background:radial-gradient(circle,#a1c4fd,#c2e9fb);}
.multi{background:linear-gradient(90deg,red,orange,yellow,green,blue,violet);}
</style></head>
<body>
<div class="box linear"></div>
<div class="box radial"></div>
<div class="box multi"></div>
</body></html>
