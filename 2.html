<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>

    <style>
        /* Element selector */
        h1 {
            color: blue;
        }

        /* Class selector */
        .para {
            color: green;
        }

        /* ID selector */
        #special {
            color: red;
        }

        /* Universal selector */
        * {
            color: purple;
            font-family: Arial;
        }

        /* Group selector */
        h2, h3 {
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <h4>Universal Selector</h3>

    <h1>Element Selector</h1>

    <p class="para">Class Selector</p>

    <p id="special">ID Selector</p>

    <h2>Group Selector</h2>
    <h3>Group Selector</h3>

</body>
</html>
