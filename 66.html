<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>66. 2D and 3D Transformations</title>
<style>
body{display:flex;gap:40px;justify-content:center;padding:80px;font-family:Arial;perspective:600px}
.box{width:100px;height:100px;background:#264653;color:#fff;display:flex;align-items:center;justify-content:center}
.translate{transform:translate(20px,20px)}
.rotate{transform:rotate(30deg)}
.scale{transform:scale(1.3)}
.skew{transform:skew(15deg,5deg)}
.rotate3d{transform:rotateY(45deg)}
</style></head>
<body>
<div class="box translate">translate</div>
<div class="box rotate">rotate</div>
<div class="box scale">scale</div>
<div class="box skew">skew</div>
<div class="box rotate3d">rotateY 3D</div>
</body></html>
