<!DOCTYPE html>
<html>
<head>

    <title>CSS Styling</title>

    <style>

        /* Element Selector */
        h1 {
            color: darkblue;
            font-family:Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        }

        /* Class Selector */
        .paragraph {
            color: green;
            font-size: 20px;
        }

        /* ID Selector */
        #box {
            background-color: lightyellow;
            border: 3px solid black;
            margin: 30px;
            padding: 25px;
            width: 300px;
        }

    </style>

</head>
<body>

    <h1>CSS Selectors</h1>

    <p class="paragraph">
        This paragraph demonstrates CSS colors and fonts.
    </p>

    <div id="box">
        This box demonstrates margin, padding and borders.
    </div>
    

</body>
</html>
