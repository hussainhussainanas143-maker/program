<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>39. Dropdown Menu</title>
<style>
.dropdown{position:relative;display:inline-block;font-family:Arial}
.dropdown > button{padding:10px 16px;background:#1d3557;color:#fff;border:none;border-radius:4px;cursor:pointer}
.dropdown-content{display:none;position:absolute;background:#fff;min-width:160px;box-shadow:0 4px 10px rgba(0,0,0,.2);border-radius:4px;overflow:hidden}
.dropdown-content a{display:block;padding:10px 14px;color:#333;text-decoration:none}
.dropdown-content a:hover{background:#f1f1f1}
.dropdown:hover .dropdown-content{display:block}
</style></head>
<body style="padding:60px">
<div class="dropdown">
  <button>Menu ▾</button>
  <div class="dropdown-content">
    <a href="#">Profile</a>
    <a href="#">Settings</a>
    <a href="#">Logout</a>
  </div>
</div>
</body></html>
