<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>30. Background Images & Positioning</title>
<style>
.box{width:300px;height:200px;margin:20px auto;border:2px solid #333;background-image:url('https://picsum.photos/400/300');}
.top-left{background-position:top left;background-repeat:no-repeat;}
.center{background-position:center;background-size:cover;}
.repeat-x{background-repeat:repeat-x;background-size:60px;}
</style></head>
<body>
<div class="box top-left"></div>
<div class="box center"></div>
<div class="box repeat-x"></div>
</body></html>
