<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>48. Two-Column Webpage Using CSS Grid</title>
<style>
body{margin:0;font-family:Arial}
.layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.left{background:#264653;color:#fff;padding:20px}
.right{padding:20px}
</style></head>
<body>
<div class="layout">
  <div class="left"><h3>Sidebar</h3><p>Navigation links here.</p></div>
  <div class="right"><h3>Main Content</h3><p>Primary content column using CSS Grid.</p></div>
</div>
</body></html>
