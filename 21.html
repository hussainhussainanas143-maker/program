<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>

    <style>
        body {
            font-family: Arial;
            background-color: #eee;
        }

        .profile {
            width: 500px;
            margin: 50px auto;
            padding: 30px;
            background-color: white;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
        }

        .profile img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        td {
            border: 1px solid gray;
            padding: 10px;
        }

        td:first-child {
            font-weight: bold;
            background-color: lightblue;
        }
    </style>
</head>
<body>

    <div class="profile">

        <img src="student.jpg" alt="Student">

        <h1>Mohammad Anas Hussain</h1>

        <h3>B.Tech Student</h3>

        <table>

            <tr>
                <td>College</td>
                <td>Sai University</td>
            </tr>

            <tr>
                <td>Course</td>
                <td>B.Tech</td>
            </tr>

            <tr>
                <td>Department</td>
                <td>Computer Science</td>
            </tr>

            <tr>
                <td>Year</td>
                <td>First Year</td>
            </tr>

        </table>

    </div>

</body>
</html>
