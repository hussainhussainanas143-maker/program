<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>65. CSS Transitions</title>
<style>
.box{width:100px;height:100px;background:#e63946;border-radius:8px;margin:40px;transition:width 0.5s ease, background-color 0.5s ease, transform 0.5s ease}
.box:hover{width:200px;background:#457b9d;transform:rotate(15deg)}
</style></head>
<body>
<div class="box"></div>
<p style="font-family:Arial;margin-left:40px">Hover the box to see the transition.</p>
</body></html>
