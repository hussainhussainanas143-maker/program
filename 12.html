<!DOCTYPE html>
<html>
<head>
    <title>Lists and Tables</title>

    <style>
        ul {
            list-style-type: square;
        }

        ol {
            list-style-type: upper-roman;
        }

        table {
            border-collapse: collapse;
            width: 500px;
        }

        th, td {
            border: 2px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: lightblue;
        }

        tr:hover {
            background-color: lightyellow;
        }
    </style>
</head>
<body>

    <h2>Unordered List</h2>

    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>Python</li>
    </ul>

    <h2>Ordered List</h2>

    <ol>
        <li>Java</li>
        <li>C</li>
        <li>C++</li>
    </ol>

    <h2>Table</h2>

    <table>
        <tr>
            <th>Name</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td>Anas</td>
            <td>90</td>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>85</td>
        </tr>
    </table>

</body>
</html>
