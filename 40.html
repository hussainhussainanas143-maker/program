<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>40. Image Hover Effect</title>
<style>
.thumb{width:250px;overflow:hidden;border-radius:8px;display:inline-block;margin:20px}
.thumb img{width:100%;display:block;transition:transform .4s ease, filter .4s ease}
.thumb:hover img{transform:scale(1.15);filter:brightness(1.1)}
</style></head>
<body style="text-align:center">
<div class="thumb"><img src="https://picsum.photos/300/200" alt=""></div>
</body></html>
