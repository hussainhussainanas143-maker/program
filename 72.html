<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>72. Responsive Typography</title>
<style>
body{font-family:Arial;padding:20px}
h1{font-size:8vw}
p{font-size:calc(14px + 0.5vw); line-height:1.6}
@media (min-width:900px){ h1{font-size:3rem} }
</style></head>
<body>
<h1>Responsive Heading</h1>
<p>This paragraph's font-size scales fluidly with viewport width using calc() and vw units, staying readable on both mobile and desktop.</p>
</body></html>
