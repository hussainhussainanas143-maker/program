<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>27. Digital Clock</title>
<style>body{font-family:monospace;text-align:center;padding:60px}#clock{font-size:3em}</style>
</head>
<body>
<div id="clock">00:00:00</div>
<script>
function updateClock() {
  const now = new Date();
  const pad = n => String(n).padStart(2, "0");
  document.getElementById("clock").textContent =
    `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
}
setInterval(updateClock, 1000);
updateClock();
</script>
</body></html>
