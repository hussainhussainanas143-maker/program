<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>70. CSS-Only Modal/Popup</title>
<style>
.modal-trigger{display:inline-block;padding:10px 18px;background:#1d3557;color:#fff;border-radius:5px;text-decoration:none;font-family:Arial;margin:40px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center}
.modal-overlay:target{display:flex}
.modal{background:#fff;padding:24px;border-radius:8px;width:300px;position:relative;font-family:Arial}
.modal .close{position:absolute;top:8px;right:12px;text-decoration:none;color:#333;font-size:1.3em}
</style></head>
<body>
<a href="#modal1" class="modal-trigger">Open Modal</a>
<div id="modal1" class="modal-overlay">
  <div class="modal">
    <a href="#" class="close">&times;</a>
    <h3>CSS-Only Modal</h3>
    <p>This uses the :target pseudo-class — no JavaScript needed.</p>
  </div>
</div>
</body></html>
