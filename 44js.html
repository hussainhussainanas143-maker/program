<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>44. Display API Data Dynamically</title>
<style>ul{list-style:none;padding:0}li{padding:8px;border-bottom:1px solid #eee}</style>
</head>
<body>
<h2>Users</h2>
<ul id="userList"></ul>
<script>
async function loadUsers() {
  const res = await fetch("https://jsonplaceholder.typicode.com/users");
  const users = await res.json();
  const list = document.getElementById("userList");
  list.innerHTML = users.map(u => `<li><strong>${u.name}</strong> — ${u.email}</li>`).join("");
}
loadUsers();
</script>
</body></html>
