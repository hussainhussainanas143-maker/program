<!DOCTYPE html>
<html>
<head>
    <title>Float and Clear</title>

    <style>
        img {
            width: 200px;
            float: left;
            margin-right: 20px;
        }

        .clear {
            clear: both;
            background-color: lightblue;
            padding: 20px;
        }
    </style>
</head>
<body>

    <img src="/assets/css/ak.jpg" alt="Image">

    <p>
        This text flows around the image because
        the image is using float left.
    </p>

    <div class="clear">
        This section uses clear: both.
    </div>

</body>
</html>
