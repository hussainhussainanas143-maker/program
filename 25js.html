<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>25. Show/Hide an HTML Element</title></head>
<body>
<button onclick="toggle()">Toggle Visibility</button>
<p id="box" style="background:#eee;padding:10px;width:200px">I can be hidden!</p>
<script>
function toggle() {
  const box = document.getElementById("box");
  box.style.display = box.style.display === "none" ? "block" : "none";
}
</script>
</body></html>
